# Asciiverse release workflow (tag v* or run by hand with a tag)
# Builds DRL's console version for the Asciiverse catalog and as system
# packages.
#
# For av: one archive per target, named drl-<target>.tar.gz, plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github"). Each archive holds the drl start script and
# the game in lib/ (binary, drl.wad, core.wad, config.lua).
# For everyone else: .deb, .rpm and Arch packages from the same Linux
# build, made by nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v0.10.12c-av.1: upstream's version, then our packaging
# release. Linux builds on Ubuntu 22.04 (glibc 2.35) with Lua linked in;
# ncurses comes from the system. macOS builds each architecture on its own
# runner. No Windows build yet.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: drl
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, arch: amd64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc lua5.1 liblua5.1-0-dev
          sh asciiverse/build.sh
          file bin/drl
          ldd bin/drl

      - name: Package for av
        run: |
          sh asciiverse/stage.sh
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, runner: macos-13 }
          - { target: aarch64-apple-darwin, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          brew install fpc
          # Lua 5.1 from source, as upstream's CI does (no Homebrew formula)
          curl -fL https://www.lua.org/ftp/lua-5.1.5.tar.gz | tar xz
          (cd lua-5.1.5 && make macosx && sudo make install INSTALL_TOP=/usr/local)
          sudo ln -sf /usr/local/bin/lua /usr/local/bin/lua5.1
          sudo cp /usr/local/lib/liblua.a /usr/local/lib/liblua5.1.a
          sh asciiverse/build.sh
          file bin/drl
          otool -L bin/drl

      - name: Package
        run: |
          sh asciiverse/stage.sh
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "DRL $TAG" \
                 --notes "DRL ${TAG%%-av.*}, console version, built for the Asciiverse catalog, with .deb, .rpm and Arch packages. See PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
