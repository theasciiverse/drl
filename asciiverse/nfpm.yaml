# System packages (.deb, .rpm, Arch) for drl, built by nfpm from the same
# Linux build as the av archive. The release workflow sets VERSION,
# RELEASE (our packaging release) and ARCH (amd64 or arm64).
#
# The av layout is installed whole in /usr/lib/drl (start script, lib/),
# with /usr/bin/drl a link to the start script, which follows it. No
# .desktop file on purpose: av is the one place titles are started from.
# No .apk: this build links glibc.
name: drl
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/drl
license: GPL-2.0-only
depends:
  - libncursesw6 | ncurses-libs | ncurses
description: |
  ChaosForge's fast, tactical roguelike, in the terminal.
  Fight your way down from a Martian moon base into hell, with shotguns,
  chainsaws and rocket launchers, traits and master traits.
  DRL by Kornel Kisielewicz (ChaosForge), console version, packaged by
  Asciiverse.
contents:
  - src: stage/drl
    dst: /usr/lib/drl/drl
    file_info: { mode: 0755 }
  - src: stage/lib/
    dst: /usr/lib/drl/lib/
  - src: /usr/lib/drl/drl
    dst: /usr/bin/drl
    type: symlink
  - src: LICENSE
    dst: /usr/share/doc/drl/copyright
    file_info: { mode: 0644 }
  - src: PATCHES.md
    dst: /usr/share/doc/drl/PATCHES.md
    file_info: { mode: 0644 }
